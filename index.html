<style>
/* Valuence · Design 2 („Nova“): Schwarz mit violettem Umgebungslicht, Glas-Karten mit Haarlinien, Pill-Navigation oben,
   leichte große Zahlen. Amber bleibt der Akzent für Aktionen, Ticker bleiben gelb. */
:root {
  color-scheme: dark;
  --bg: #050507;
  --card: rgba(20, 20, 28, 0.78);
  --card-solid: #111118;
  --glass: rgba(255, 255, 255, 0.035);
  --glass-2: rgba(255, 255, 255, 0.06);
  --glass-3: rgba(255, 255, 255, 0.1);
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.13);
  --line-soft: rgba(255, 255, 255, 0.05);
  --sep: rgba(255, 255, 255, 0.08);
  --sep-soft: rgba(255, 255, 255, 0.05);
  --text: #f4f4f7;
  --text-2: rgba(236, 236, 245, 0.64);
  --text-3: rgba(236, 236, 245, 0.4);
  --amber: #ffa028;
  --amber-2: #ffbd66;
  --amber-soft: rgba(255, 160, 40, 0.14);
  --ink: #1a0f00;
  --ticker: #ffd23f;
  --violet: #8b7cff;
  --pos: #30d158;
  --pos-soft: rgba(48, 209, 88, 0.14);
  --neg: #ff453a;
  --neg-soft: rgba(255, 69, 58, 0.14);
  --neu: #ffd60a;
  --warn-bg: rgba(255, 69, 58, 0.14);
  --shadow: 0 24px 60px -18px rgba(0, 0, 0, 0.75);
  --font: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-xl: 28px; --r-lg: 24px; --r: 16px; --r-sm: 12px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--amber); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
::selection { background: rgba(255, 160, 40, 0.35); }
.num, td.r, .tab, .t td { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Hintergrund: Umgebungslicht, Umlaufbahnen, Sterne */
.bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bgfx .glow { position: absolute; border-radius: 50%; }
.bgfx .g1 { width: 900px; height: 700px; left: -260px; top: -320px; background: radial-gradient(closest-side, rgba(112, 92, 255, 0.24), transparent); }
.bgfx .g2 { width: 1000px; height: 800px; right: -380px; bottom: -420px; background: radial-gradient(closest-side, rgba(70, 60, 220, 0.2), transparent); }
.bgfx .g3 { width: 700px; height: 520px; right: 8%; top: -260px; background: radial-gradient(closest-side, rgba(255, 140, 40, 0.08), transparent); }
.bgfx .orbit { position: absolute; border: 1px solid rgba(255, 255, 255, 0.045); border-radius: 50%; }
.bgfx .o1 { width: 1500px; height: 760px; left: -700px; top: 120px; transform: rotate(-18deg); }
.bgfx .o2 { width: 1200px; height: 620px; right: -640px; top: 320px; transform: rotate(24deg); }
.bgfx .stars { position: absolute; inset: 0; opacity: 0.55;
  background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 34% 72%, #cfd3ff, transparent),
    radial-gradient(1.4px 1.4px at 58% 12%, #fff, transparent), radial-gradient(1px 1px at 76% 64%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 88% 26%, #d9d4ff, transparent), radial-gradient(1px 1px at 22% 88%, #fff, transparent),
    radial-gradient(1px 1px at 47% 44%, #b9b4ff, transparent), radial-gradient(1.3px 1.3px at 93% 84%, #fff, transparent); }

/* ---------- Grundgerüst mit Navigation oben */
.app { position: relative; z-index: 1; max-width: 1560px; margin: 0 auto; min-height: 100dvh;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.topnav { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 40; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
  gap: 14px; padding: 8px 8px 8px 14px; border-radius: 999px; background: rgba(12, 12, 18, 0.72); border: 1px solid var(--line);
  -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); box-shadow: 0 16px 40px -16px rgba(0, 0, 0, 0.8), inset 0 1px 0 rgba(255, 255, 255, 0.04); }
.brand { display: flex; align-items: center; gap: 11px; min-width: max-content; }
.logo { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; color: var(--ink);
  background: radial-gradient(circle at 32% 28%, #ffe2b0, #ffa83a 46%, #ff6a3d 100%); box-shadow: 0 0 22px rgba(255, 140, 40, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.5); }
.brand b { display: block; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--text-3); font-size: 11px; }
.navpill { justify-self: center; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line); min-width: max-content; }
.nav { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 0; background: none;
  color: var(--text-2); font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
.nav.on { color: var(--text); background: rgba(255, 255, 255, 0.08); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.07); }
.nav.on::after { content: ""; position: absolute; left: 50%; bottom: 3px; width: 22px; height: 2px; transform: translateX(-50%); border-radius: 2px;
  background: var(--amber); box-shadow: 0 0 10px 2px rgba(255, 160, 40, 0.65); }
.nav .cnt { font-size: 11px; color: var(--text-3); font-weight: 600; }
.tools { display: flex; align-items: center; gap: 8px; min-width: max-content; }
.iconbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); color: var(--text-2);
  display: grid; place-items: center; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
.iconbtn.on { color: var(--amber); border-color: rgba(255, 160, 40, 0.45); background: var(--amber-soft); }
.searchpill { display: inline-flex; align-items: center; gap: 9px; height: 40px; padding: 0 8px 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03); color: var(--text-3); cursor: pointer; min-width: 190px; }
.searchpill svg { width: 16px; height: 16px; }
.searchpill .kbd { margin-left: auto; }
.searchpill:hover { color: var(--text-2); background: rgba(255, 255, 255, 0.06); }
.status { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.status .stxt { min-width: 84px; max-width: 128px; overflow: hidden; text-overflow: ellipsis; }   /* Mindestbreite: Leiste springt beim Speichern nicht */
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); flex: none; box-shadow: 0 0 8px rgba(48, 209, 88, 0.7); }
.dot.wait { background: var(--neu); box-shadow: 0 0 8px rgba(255, 214, 10, 0.6); } .dot.off { background: var(--neg); box-shadow: 0 0 8px rgba(255, 69, 58, 0.6); }
.acct { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 5px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); min-width: 0; }
.acct .ini { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--ink);
  background: radial-gradient(circle at 30% 25%, #fff1d6, #ffb347 60%, #ff7a3d); }
.acct .mail { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text-2); }
.acct .iconbtn { width: 30px; height: 30px; }
.acct .iconbtn svg { width: 15px; height: 15px; }
/* Platz in der Leiste: main.jsx misst nach und setzt Stufen, bis alles passt (Schrift, E-Mail und Zähler sind je Gerät verschieden breit) */
.topnav[data-c1] .acct .mail { display: none; }
.topnav[data-c2] .nav { padding: 0 12px; } .topnav[data-c2] .tools { gap: 6px; }
.topnav[data-c3] .brand small { display: none; }
.topnav[data-c4] .searchpill { min-width: 0; width: 40px; padding: 0; justify-content: center; }
.topnav[data-c4] .searchpill .lbl, .topnav[data-c4] .searchpill .kbd { display: none; }
.topnav[data-c5] .status .stxt { display: none; } .topnav[data-c5] .status { padding: 0 8px; }
.topnav[data-c6] .nav:not(.on) .lbl, .topnav[data-c6] .nav:not(.on) .cnt { display: none; } .topnav[data-c6] .nav { padding: 0 13px; }
.topnav[data-c7] .nav .lbl, .topnav[data-c7] .nav .cnt { display: none; }
@media (pointer: coarse) { .searchpill .kbd { display: none; } }
.iconbtn:disabled { opacity: 0.4; cursor: default; }
.main { display: flex; flex-direction: column; gap: 18px; padding-top: 22px; min-width: 0; }

/* Telefon und schmale Fenster: Leiste unten */
.tabbar { display: none; }
@media (max-width: 899px) {
  .navpill, .tools .hide-m { display: none; }
  .topnav { grid-template-columns: minmax(0, 1fr) auto; padding: 6px 6px 6px 10px; }
  .brand small { display: none; }
  .main { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: flex; position: fixed; z-index: 45; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); height: 66px; padding: 6px; border-radius: 999px; justify-content: space-between;
    background: rgba(14, 14, 20, 0.82); border: 1px solid var(--line); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.85); }
  .tabbar button { flex: 1; min-width: 0; border: 0; background: none; color: var(--text-3); border-radius: 999px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; cursor: pointer; }
  .tabbar button svg { width: 20px; height: 20px; }
  .tabbar button.on { color: var(--text); background: rgba(255, 255, 255, 0.08); }
  .tabbar button.on svg { color: var(--amber); filter: drop-shadow(0 0 6px rgba(255, 160, 40, 0.6)); }
}
.morelist { display: flex; flex-direction: column; gap: 4px; }
.morelist .nav { width: 100%; height: 48px; justify-content: flex-start; }
.morelist .nav .lbl, .morelist .nav .cnt { display: inline !important; }
.morelist .nav .cnt { margin-left: auto; }

/* ---------- Kopf jeder Seite */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 6px 4px 2px; }
.head h1 { margin: 0; font-weight: 500; font-size: 38px; line-height: 1.08; letter-spacing: -0.03em; text-wrap: balance; }
.head p { margin: 6px 0 0; color: var(--text-2); }
.head .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
@media (max-width: 760px) { .head h1 { font-size: 30px; } }

/* ---------- Karten */
.card { position: relative; background: linear-gradient(180deg, rgba(24, 24, 33, 0.84), rgba(15, 15, 21, 0.84)); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 20px 22px; min-width: 0; box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04); }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card > header > div:first-child { min-width: 0; }
.card h2 { margin: 0; font-weight: 600; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
.card h2 .idx, .idx { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.card h3 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; }
.sub { color: var(--text-2); font-size: 12.5px; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
@media (max-width: 1180px) { .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8 { grid-column: span 12; } }
@media (max-width: 760px) { .s3, .s6 { grid-column: span 12; } .grid { gap: 14px; } .card { padding: 16px; border-radius: 22px; } }

/* ---------- Knöpfe, Felder, Segmente */
.btn { height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.04); color: var(--text); font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap; transition: background 0.15s, border-color 0.15s, box-shadow 0.15s; }
.btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
.btn.pri { background: linear-gradient(135deg, #ffbe5c, #ff9220 55%, #ff7a2b); border-color: transparent; color: var(--ink); font-weight: 600;
  box-shadow: 0 10px 26px -10px rgba(255, 140, 40, 0.75), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
.btn.pri:hover { filter: brightness(1.06); box-shadow: 0 12px 30px -10px rgba(255, 140, 40, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.45); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--amber); padding: 0 10px; }
.btn.ghost:hover { background: var(--amber-soft); }
.btn.danger { background: var(--neg-soft); border-color: rgba(255, 69, 58, 0.3); color: #ff8a80; }
.btn.sm { height: 32px; padding: 0 13px; font-size: 13px; }
.btn.icon { width: 40px; padding: 0; }
.btn.icon.sm { width: 32px; }
.btn.icon.ghost { color: var(--text-2); }
.btn.icon.ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.07); }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.btn svg { width: 16px; height: 16px; }

.in, select.in, textarea.in { height: 40px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.035); color: var(--text); padding: 0 15px; min-width: 0; width: 100%;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }
textarea.in { height: auto; min-height: 90px; padding: 11px 15px; resize: vertical; line-height: 1.5; border-radius: 18px; }
.in::placeholder, textarea.in::placeholder { color: var(--text-3); }
.in:hover { border-color: var(--line-2); }
.in:focus, textarea.in:focus { outline: none; border-color: rgba(255, 160, 40, 0.65); background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 0 4px rgba(255, 160, 40, 0.12); }
.in.bad { border-color: var(--neg); box-shadow: 0 0 0 4px rgba(255, 69, 58, 0.12); }
select.in { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 19px) 17px, calc(100% - 14px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
select.in option, select.in optgroup { background: #17171f; color: var(--text); }
.in.sm, select.in.sm { height: 32px; font-size: 13px; padding: 0 12px; }
select.in.sm { padding-right: 30px; background-position: calc(100% - 17px) 13px, calc(100% - 12px) 13px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search .in { padding-left: 39px; }

.seg { display: inline-flex; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--text-2); height: 30px; padding: 0 13px; border-radius: 999px; font-weight: 500; cursor: pointer; font-size: 13px; transition: background 0.15s, color 0.15s; }
.seg button:hover { color: var(--text); }
.seg button.on { background: rgba(255, 255, 255, 0.12); color: var(--text); box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08); }
.seg.trend button { min-width: 42px; }
.seg.trend button.on.pos { background: var(--pos); color: #002b0d; }
.seg.trend button.on.neg { background: var(--neg); color: #2b0300; }

.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.pill svg { width: 12px; height: 12px; }
.pill.pos { background: var(--pos-soft); border-color: rgba(48, 209, 88, 0.3); color: var(--pos); }
.pill.neg { background: var(--neg-soft); border-color: rgba(255, 69, 58, 0.3); color: #ff6b61; }
.pill.amb { background: var(--amber-soft); border-color: rgba(255, 160, 40, 0.32); color: var(--amber); }
.pill.neu { background: rgba(255, 214, 10, 0.12); border-color: rgba(255, 214, 10, 0.28); color: var(--neu); }
.pill.tiny { height: 18px; font-size: 10.5px; padding: 0 7px; margin-left: 8px; vertical-align: 1px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03);
  color: var(--text); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; transition: background 0.15s, border-color 0.15s; }

  border: 1px solid var(--line-2); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); color: var(--text); padding: 11px 20px; border-radius: 999px; box-shadow: var(--shadow); font-weight: 500; max-width: calc(100vw - 32px); }
.toast.err { background: rgba(58, 21, 19, 0.94); color: #ffb4ae; border-color: rgba(255, 69, 58, 0.3); }
@media (max-width: 899px) { .toast { bottom: calc(92px + env(safe-area-inset-bottom, 0px)); } }

/* ---------- Profil */

.prof-head .t1 .tick { font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -0.01em; color: var(--ticker); text-shadow: 0 0 26px rgba(255, 210, 63, 0.25); }

.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 30px; }

.kv2 { display: flex; flex-direction: column; }
.kvrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 9px 0; box-shadow: inset 0 -1px 0 var(--line-soft); min-height: 40px; min-width: 0; }
.kvrow .k { color: var(--text-2); flex: none; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kvrow .v { text-align: right; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }

.lbl-sel { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13.5px; padding: 0; cursor: pointer; max-width: 100%; text-overflow: ellipsis; }
.lbl-sel:hover { color: var(--text); }

.trends { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 30px; }
@media (max-width: 640px) { .trends { grid-template-columns: 1fr; } }
.tr-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; box-shadow: inset 0 -1px 0 var(--line-soft); min-width: 0; }
.tr-row .lbl-sel { flex: 1; min-width: 0; }
.tr-row .val { font-weight: 700; min-width: 34px; text-align: right; }
.text-box { background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line-soft); border-radius: 18px; padding: 12px 15px; min-height: 72px; white-space: pre-wrap; overflow-wrap: anywhere; }

.texts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }
.texts .wide { grid-column: 1 / -1; }
@media (max-width: 640px) { .texts { grid-template-columns: 1fr; } }
.texts h3 { margin-bottom: 7px; }
table.kc { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.kc th { color: var(--text-3); font-size: 11.5px; font-weight: 600; text-align: left; padding: 0 0 7px; }
.kc th.r, .kc td.r { text-align: right; }
.kc td { padding: 8px 0; box-shadow: inset 0 -1px 0 var(--line-soft); font-variant-numeric: tabular-nums; }
.kc td:first-child { max-width: 0; width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.grid.inner { gap: 18px; }
.notes textarea { min-height: 190px; }
.notes .hint { display: block; margin-top: 7px; padding: 0 4px; }
.files { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
.file { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.file .pv { aspect-ratio: 4 / 3; max-width: 100%; background: #0b0b10; display: grid; place-items: center; cursor: pointer; border: 0; padding: 0; color: var(--text-2); text-decoration: none; }
.file .pv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.file .pv svg { width: 34px; height: 34px; color: #ff7b72; }
.file .fm { padding: 8px 8px 8px 12px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.file .fm span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; }
.file .fm small { display: block; color: var(--text-3); font-size: 11px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 18px; padding: 18px; text-align: center; color: var(--text-2); font-size: 13px; }
.drop.over { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
.lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(3, 3, 8, 0.92); display: grid; place-items: center; padding: 24px; }
.lightbox img { max-width: 100%; max-height: calc(100dvh - 80px); border-radius: 16px; }
.lightbox > .btn { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.lb-cap { position: absolute; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--text-2); font-size: 13px; }
.lightbox .lb-prev, .lightbox .lb-next { position: absolute; top: 50%; transform: translateY(-50%); }

.lightbox .lb-next { right: max(16px, env(safe-area-inset-right, 0px)); }

/* Diagramm: Abweichung vom Peer-Median */
.dv { display: flex; flex-direction: column; }
.dv-row { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) 84px 128px; gap: 14px; align-items: center; padding: 3px 6px; border-radius: 10px; }
.dv-row:not(.dv-axis):hover { background: rgba(255, 255, 255, 0.04); }
.dv-axis { padding-bottom: 2px; color: var(--text-3); font-size: 11px; }
.dv-scale { display: flex; justify-content: space-between; }
.dv-scale i { font-style: normal; font-variant-numeric: tabular-nums; }
.dv-name { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dv-track { position: relative; height: 22px; }
.dv-track::before { content: ""; position: absolute; left: 25%; right: 25%; top: 0; bottom: 0; border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); }
.dv-zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: rgba(236, 236, 245, 0.3); }
.dv-bar { position: absolute; top: 5px; height: 12px; border-radius: 0 6px 6px 0; }
.dv-bar.neg { border-radius: 6px 0 0 6px; }
.dv-bar.over::after { content: ""; position: absolute; top: 2px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.dv-bar.over:not(.neg)::after { right: -7px; border-left: 5px solid rgba(236, 236, 245, 0.6); }
.dv-bar.neg.over::after { left: -7px; border-right: 5px solid rgba(236, 236, 245, 0.6); }
.dv-dev { text-align: right; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dv-vals { text-align: right; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-legend { margin-top: 12px; padding: 0 6px; }
@media (max-width: 640px) {
  .dv-row { grid-template-columns: minmax(0, 1fr) 78px; gap: 2px 10px; padding: 5px 2px; }
  .dv-name { grid-column: 1 / -1; }
  .dv-vals { display: none; }
  .dv-axis span:first-child, .dv-axis span:last-child { display: none; }
}

/* ---------- Import, Einstellungen, Anleitung */

  box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9), 0 0 90px -30px rgba(139, 124, 255, 0.45); }

/* Valuence · Design „Terminal“ (Standard): Schwarz, Schreibmaschinenschrift für Zahlen und Beschriftungen, Rasterlinien,
   eckige Formen, Amber für Aktives und Ticker. Liegt als Schicht über Nova (Design 2); aktiv mit <html data-design="terminal">.
   Funktionen und Aufbau bleiben gleich, nur die Darstellung ändert sich. */
[data-design="terminal"] {
  --bg: #000000;
  --card: #0b0b0b; --card-solid: #0b0b0b;
  --glass: #0b0b0b; --glass-2: #111111; --glass-3: #161616;
  --line: #262626; --line-2: #3a3a3a; --line-soft: #1c1c1c; --sep: #262626; --sep-soft: #1c1c1c;
  --head: #0f0f0f;
  --text: #f2f2f2; --text-2: #b0b0b0; --text-3: #8c8c8c;
  --amber: #ffa028; --amber-2: #ffc170; --amber-soft: rgba(255, 160, 40, 0.12); --ink: #000000;
  --ticker: #ffa028;
  --pos: #4ade80; --pos-soft: rgba(74, 222, 128, 0.1);
  --neg: #ff6b6b; --neg-soft: rgba(255, 107, 107, 0.1);
  --neu: #f2c94c;
  --warn-bg: rgba(255, 107, 107, 0.12);
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.85);
  --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-xl: 0; --r-lg: 0; --r: 0; --r-sm: 0;
}
[data-design="terminal"] *, [data-design="terminal"] *::before, [data-design="terminal"] *::after { border-radius: 0 !important; }
[data-design="terminal"] ::selection { background: rgba(255, 160, 40, 0.4); }
[data-design="terminal"] :focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
[data-design="terminal"] .bgfx, [data-design="terminal"] .orbs, [data-design="terminal"] .logo, [data-design="terminal"] .av { display: none !important; }

/* Schreibmaschinenschrift für Zahlen, Beschriftungen und Bedienelemente */
[data-design="terminal"] :is(.head h1, .head p, .card h2, .card h3, h3.sec, .btn, .in, .seg button, .pill, .chip, .tag, .kbd, .tabs button,
  .t th, .t td.r, .t td.c, .tick, .tickin, .lh, .li .cellx, .tile .lab, .tile .big, .tile .sub, .hits, .status, .tabbar button, .modal > header h2,
  .pop .ttl, .legend, .segpart, .fld > label, .kc th, .kc td.r, .kvrow .v, .tr-row .val, .dv-dev, .dv-vals, .dv-axis, .toast, .num, .cntb, .idx,
  .unit span, .calc, .banner, .drop, .switch, .doc h2, .empty b, .tagname b, .morelist .nav, .linkn.cnum) { font-family: var(--mono); }
[data-design="terminal"] textarea.in, [data-design="terminal"] .pastezone { font-family: var(--mono); }
[data-design="terminal"] textarea.in:not(.pastezone) { font-family: var(--font); }

/* ---------- Grundgerüst und Kopfleiste */
[data-design="terminal"] .app { padding-top: 0; }
[data-design="terminal"] .main { gap: 14px; padding-top: 16px; }
.tnav { position: sticky; top: 0; z-index: 40; display: flex; flex-direction: column; gap: 10px; background: var(--bg);
  padding: calc(10px + env(safe-area-inset-top, 0px)) 0 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
.tnav .tline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 22px; min-height: 22px; font-size: 12px; letter-spacing: 0.06em;
  text-transform: uppercase; color: var(--text-3); }
.tnav .tbrand { color: var(--amber); font-weight: 600; letter-spacing: 0.16em; }
.tnav .sp { flex: 1 1 auto; }
.tnav .status { height: auto; padding: 0; gap: 8px; font-size: 12px; letter-spacing: 0.06em; color: var(--pos); }
.tnav .status:has(.dot.wait) { color: var(--neu); }
.tnav .status:has(.dot.off) { color: var(--neg); }
.tnav .status .stxt { max-width: 220px; }
.tnav .acct { display: inline-flex; align-items: center; gap: 8px; min-width: 0; height: auto; padding: 0; border: 0; background: none;
  text-transform: none; letter-spacing: 0; color: var(--text-2); }
.tnav .acct .mail { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.tnav .tx { width: 26px; height: 26px; display: grid; place-items: center; border: 1px solid var(--line); background: var(--bg); color: var(--text-2); cursor: pointer; padding: 0; }
.tnav .tx:hover { color: var(--text); border-color: var(--line-2); }
.tnav .tx svg { width: 14px; height: 14px; }
.tnav .trow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tnav .tkeys { display: flex; flex-wrap: wrap; gap: 4px; }
.tk { height: 34px; padding: 0 12px; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text);
  font: 500 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; white-space: nowrap; cursor: pointer; transition: background 0.12s, border-color 0.12s; }
.tk .k, .tk .cnt { color: var(--text-3); }
.tk .cnt { font-size: 11px; }
.tk:hover { background: #111111; border-color: var(--line-2); }
.tk.on { background: var(--amber); border-color: var(--amber); color: #000000; font-weight: 600; }
.tk.on .k, .tk.on .cnt { color: rgba(0, 0, 0, 0.66); }
.tnav .tside { flex: 1 1 380px; min-width: 0; display: flex; align-items: center; gap: 8px; }
.tcmd { flex: 1 1 auto; min-width: 0; height: 34px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 12px; border: 1px solid var(--line);
  background: var(--bg); color: var(--text-3); font: 12px/1 var(--mono); text-align: left; cursor: text; }
.tcmd .p { flex: none; color: var(--amber); font-weight: 600; letter-spacing: 0.06em; }
.tcmd .ph { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcmd .kbd { flex: none; }
.tcmd:hover { border-color: var(--line-2); color: var(--text-2); }
[data-design="terminal"] .tnav .iconbtn { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--bg); color: var(--text-2); }
[data-design="terminal"] .tnav .iconbtn svg { width: 16px; height: 16px; }
[data-design="terminal"] .tnav .iconbtn:hover { color: var(--text); border-color: var(--line-2); background: #111111; }
[data-design="terminal"] .tnav .iconbtn.on { color: var(--amber); border-color: var(--amber); background: var(--bg); }
[data-design="terminal"] .dot { box-shadow: none; }
[data-design="terminal"] .status { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }

/* Telefon und schmale Fenster: Leiste unten, oben nur Marke, Status und Suche */
@media (max-width: 899px) {
  [data-design="terminal"] .tnav .tkeys, [data-design="terminal"] .tnav .tsub, [data-design="terminal"] .tnav .tdate,
  [data-design="terminal"] .tnav .tcount, [data-design="terminal"] .tnav .hide-m { display: none; }
  [data-design="terminal"] .main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  [data-design="terminal"] .tabbar { left: 0; right: 0; bottom: 0; height: calc(60px + env(safe-area-inset-bottom, 0px)); padding: 0 0 env(safe-area-inset-bottom, 0px);
    gap: 0; background: var(--bg); border: 0; border-top: 1px solid var(--line); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  [data-design="terminal"] .tabbar button { border-top: 2px solid transparent; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  [data-design="terminal"] .tabbar button.on { background: transparent; color: var(--amber); border-top-color: var(--amber); }
  [data-design="terminal"] .tabbar button.on svg { filter: none; }
  [data-design="terminal"] .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
@media (pointer: coarse) { .tcmd .kbd { display: none; } }
[data-design="terminal"] .morelist .nav { height: 44px; border: 1px solid var(--line); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); }
[data-design="terminal"] .morelist .nav.on { background: var(--amber); border-color: var(--amber); color: #000000; }
[data-design="terminal"] .nav.on::after { display: none; }

/* ---------- Seitenkopf */
