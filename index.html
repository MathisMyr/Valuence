<style>
/* Valuence · Design „Aurora“ (Grundlage): Schwarz mit neutralem Umgebungslicht, Karten aus leicht schimmerndem Glas,
   schwebende Navigation oben, aktive Auswahl als weiße Pille, leichte große Zahlen in Inter.
   Amber bleibt der Akzent für Aktionen, Ticker bleiben gelb. Terminal (terminal.css) liegt als Schicht darüber. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --card: rgba(18, 18, 21, 0.8);
  --card-solid: #111113;
  --glass: rgba(255, 255, 255, 0.035);
  --glass-2: rgba(255, 255, 255, 0.06);
  --glass-3: rgba(255, 255, 255, 0.1);
  --line: rgba(255, 255, 255, 0.08);
  --line-2: rgba(255, 255, 255, 0.13);
  --line-soft: rgba(255, 255, 255, 0.05);
  --sep: rgba(255, 255, 255, 0.08);
  --sep-soft: rgba(255, 255, 255, 0.05);
  --text: #f4f4f5;
  --text-2: #b4b4bc;
  --text-3: #8e8e96;
  --amber: #ffa028;
  --amber-2: #ffbd66;
  --amber-soft: rgba(255, 160, 40, 0.14);
  --ink: #1a0f00;
  --ticker: #ffd23f;
  --pos: #4ade80;
  --pos-soft: rgba(74, 222, 128, 0.12);
  --neg: #fb7185;
  --neg-soft: rgba(251, 113, 133, 0.13);
  --neu: #facc15;
  --warn-bg: rgba(251, 113, 133, 0.13);
  --shadow: 0 24px 60px -18px rgba(0, 0, 0, 0.75);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r-xl: 26px; --r-lg: 22px; --r: 16px; --r-sm: 12px;
  /* Glas: leichter Verlauf, helle Oberkante, Weichzeichner */
  --glass-card: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.015));
  --glass-edge: inset 0 1px 0 rgba(255, 255, 255, 0.075);
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--text); }
body { margin: 0; font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--amber); }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
::selection { background: rgba(255, 160, 40, 0.35); }
.num, td.r, .tab, .t td { font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* ---------- Hintergrund: neutrales Umgebungslicht (keine Sterne, keine Umlaufbahnen) */
.bgfx { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bgfx .glow { position: absolute; border-radius: 50%; }
.bgfx .g1 { width: 1200px; height: 900px; left: -420px; top: -460px; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.075), transparent); }
.bgfx .g2 { width: 1200px; height: 1000px; right: -520px; bottom: -480px; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.045), transparent); }
.bgfx .g3 { width: 800px; height: 600px; right: 14%; top: -330px; background: radial-gradient(closest-side, rgba(255, 160, 40, 0.045), transparent); }
.bgfx .orbit, .bgfx .stars { display: none; }
.bgfx .orbit { position: absolute; border: 1px solid rgba(255, 255, 255, 0.045); border-radius: 50%; }
.bgfx .o1 { width: 1500px; height: 760px; left: -700px; top: 120px; transform: rotate(-18deg); }
.bgfx .o2 { width: 1200px; height: 620px; right: -640px; top: 320px; transform: rotate(24deg); }
.bgfx .stars { position: absolute; inset: 0; opacity: 0.55;
  background-image: radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent), radial-gradient(1px 1px at 34% 72%, #cfd3ff, transparent),
    radial-gradient(1.4px 1.4px at 58% 12%, #fff, transparent), radial-gradient(1px 1px at 76% 64%, #fff, transparent),
    radial-gradient(1.2px 1.2px at 88% 26%, #d9d4ff, transparent), radial-gradient(1px 1px at 22% 88%, #fff, transparent),
    radial-gradient(1px 1px at 47% 44%, #b9b4ff, transparent), radial-gradient(1.3px 1.3px at 93% 84%, #fff, transparent); }

/* ---------- Grundgerüst mit Navigation oben */
.app { position: relative; z-index: 1; max-width: 1560px; margin: 0 auto; min-height: 100dvh;
  padding: calc(14px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.topnav { position: sticky; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 40; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center;
  gap: 14px; padding: 8px 8px 8px 12px; border-radius: 999px; background: rgba(18, 18, 21, 0.62); border: 1px solid rgba(255, 255, 255, 0.09);
  -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%); box-shadow: var(--glass-edge), 0 20px 50px -30px rgba(0, 0, 0, 0.9); }
.brand { display: flex; align-items: center; gap: 11px; min-width: max-content; }
/* Logo: in beiden Designs identisch (quadratisch, Amber, wie das App-Symbol) */
.logo { width: 36px; height: 36px; flex: none; display: block; border-radius: 0; }
.brand b { display: block; font-weight: 600; font-size: 16px; letter-spacing: -0.01em; }
.brand small { display: block; color: var(--text-3); font-size: 11px; }
.navpill { justify-self: center; display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: transparent; border: 1px solid transparent; min-width: max-content; }
.nav { position: relative; display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: none;
  color: var(--text-2); font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap; transition: background 0.15s, color 0.15s; }
.nav svg { width: 18px; height: 18px; flex: none; }
.nav .k { display: none; }                         /* Tastenziffer: nur im Terminal sichtbar */
.nav:hover { color: var(--text); background: rgba(255, 255, 255, 0.04); }
.nav.on { color: #0a0a0b; background: #f4f4f5; font-weight: 600; box-shadow: 0 6px 18px -8px rgba(255, 255, 255, 0.35); }
.nav .cnt { font-size: 11px; color: var(--text-3); font-weight: 600; }
.nav.on .cnt { color: #52525b; }
.tools { display: flex; align-items: center; gap: 6px; min-width: max-content; }
.iconbtn { width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); color: var(--text-2);
  display: grid; place-items: center; cursor: pointer; transition: background 0.15s, color 0.15s, border-color 0.15s; }
.iconbtn svg { width: 18px; height: 18px; }
.iconbtn:hover { background: rgba(255, 255, 255, 0.08); color: var(--text); }
.iconbtn.on { color: var(--amber); border-color: rgba(255, 160, 40, 0.45); background: var(--amber-soft); }
.searchpill { display: inline-flex; align-items: center; gap: 9px; height: 40px; padding: 0 8px 0 14px; border-radius: 999px; border: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.03); color: var(--text-3); cursor: pointer; min-width: 170px; }
.searchpill svg { width: 16px; height: 16px; }
.searchpill .kbd { margin-left: auto; }
.searchpill:hover { color: var(--text-2); background: rgba(255, 255, 255, 0.06); }
.status { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 999px; color: var(--text-3); font-size: 12px; white-space: nowrap; }
.status .stxt { min-width: 84px; max-width: 128px; overflow: hidden; text-overflow: ellipsis; }   /* Mindestbreite: Leiste springt beim Speichern nicht */
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pos); flex: none; box-shadow: 0 0 8px rgba(74, 222, 128, 0.7); }
.dot.wait { background: var(--neu); box-shadow: 0 0 8px rgba(250, 204, 21, 0.6); } .dot.off { background: var(--neg); box-shadow: 0 0 8px rgba(251, 113, 133, 0.6); }
.acct { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 6px 0 5px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03); min-width: 0; }
.acct .ini { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 12px; color: var(--ink);
  background: radial-gradient(circle at 30% 25%, #fff1d6, #ffb347 60%, #ff7a3d); }
.acct .mail { max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text-2); }
.acct .iconbtn { width: 30px; height: 30px; }
.acct .iconbtn svg { width: 15px; height: 15px; }
/* Platz in der Leiste: main.jsx misst nach und setzt Stufen, bis alles passt (Schrift, E-Mail und Zähler sind je Gerät verschieden breit) */
.topnav[data-c1] .acct .mail { display: none; }
.topnav[data-c2] .nav { padding: 0 11px; } .topnav[data-c2] .tools { gap: 5px; }
.topnav[data-c3] .brand small { display: none; }
.topnav[data-c4] .searchpill { min-width: 0; width: 40px; padding: 0; justify-content: center; }
.topnav[data-c4] .searchpill .lbl, .topnav[data-c4] .searchpill .kbd { display: none; }
.topnav[data-c5] .status .stxt { display: none; } .topnav[data-c5] .status { padding: 0 8px; }
.topnav[data-c6] .nav:not(.on) .lbl, .topnav[data-c6] .nav:not(.on) .cnt { display: none; } .topnav[data-c6] .nav { padding: 0 13px; }
.topnav[data-c7] .nav .lbl, .topnav[data-c7] .nav .cnt { display: none; }
@media (pointer: coarse) { .searchpill .kbd { display: none; } }
.iconbtn:disabled { opacity: 0.4; cursor: default; }
.main { display: flex; flex-direction: column; gap: 18px; padding-top: 22px; min-width: 0; }

/* Telefon und schmale Fenster: Leiste unten */
.tabbar { display: none; }
@media (max-width: 899px) {
  .navpill, .tools .hide-m { display: none; }
  .topnav { grid-template-columns: minmax(0, 1fr) auto; padding: 6px 6px 6px 10px; }
  .brand small { display: none; }
  .main { padding-bottom: calc(92px + env(safe-area-inset-bottom, 0px)); }
  .tabbar { display: flex; position: fixed; z-index: 45; left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
    bottom: calc(12px + env(safe-area-inset-bottom, 0px)); height: 66px; padding: 6px; border-radius: 999px; justify-content: space-between;
    background: rgba(14, 14, 17, 0.9); border: 1px solid var(--line); -webkit-backdrop-filter: blur(20px) saturate(150%); backdrop-filter: blur(20px) saturate(150%);
    box-shadow: 0 16px 40px -10px rgba(0, 0, 0, 0.85); }
  .tabbar button { flex: 1; min-width: 0; border: 0; background: none; color: var(--text-3); border-radius: 999px; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 3px; font-size: 10.5px; font-weight: 600; cursor: pointer; }
  .tabbar button svg { width: 20px; height: 20px; }
  .tabbar button.on { color: #0a0a0b; background: #f4f4f5; font-weight: 600; }
  .tabbar button.on svg { color: #0a0a0b; }
}
.morelist { display: flex; flex-direction: column; gap: 4px; }
.morelist .nav { width: 100%; height: 48px; justify-content: flex-start; }
.morelist .nav .lbl, .morelist .nav .cnt { display: inline !important; }
.morelist .nav .cnt { margin-left: auto; }

/* ---------- Kopf jeder Seite */
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding: 6px 4px 2px; }
.head h1 { margin: 0; font-weight: 300; font-size: 44px; line-height: 1.08; letter-spacing: -0.035em; text-wrap: balance; }
.head p { margin: 6px 0 0; color: var(--text-2); }
.head .acts { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
@media (max-width: 760px) { .head h1 { font-size: 32px; } }

/* ---------- Karten */
.card { position: relative; background: var(--glass-card); border: 1px solid var(--line); border-radius: var(--r-lg);
  padding: 20px 22px; min-width: 0; box-shadow: var(--glass-edge); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.card > header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
.card > header > div:first-child { min-width: 0; }
.card h2 { margin: 0; font-weight: 600; font-size: 17px; letter-spacing: -0.01em; display: flex; align-items: baseline; gap: 8px; }
.card h2 .idx, .idx { font-size: 11px; font-weight: 600; color: var(--text-3); letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
.card h3 { margin: 0 0 8px; font-size: 11.5px; font-weight: 600; color: var(--text-3); letter-spacing: 0.06em; text-transform: uppercase; }
.sub { color: var(--text-2); font-size: 12.5px; }
.grid { display: grid; gap: 18px; grid-template-columns: repeat(12, minmax(0, 1fr)); }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
@media (max-width: 1180px) { .s3 { grid-column: span 6; } .s4, .s5, .s7, .s8 { grid-column: span 12; } }
@media (max-width: 760px) { .s3, .s6 { grid-column: span 12; } .grid { gap: 14px; } .card { padding: 16px; border-radius: 22px; } }

/* ---------- Knöpfe, Felder, Segmente */
.btn { height: 40px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255, 255, 255, 0.04); color: var(--text); font-weight: 500;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; white-space: nowrap; transition: background 0.15s, border-color 0.15s, box-shadow 0.15s; }
.btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); }
.btn.pri { background: var(--amber); border-color: transparent; color: var(--ink); font-weight: 600;
  box-shadow: 0 10px 26px -12px rgba(255, 160, 40, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.35); }
.btn.pri:hover { background: var(--amber); filter: brightness(1.05); box-shadow: 0 12px 30px -12px rgba(255, 160, 40, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.4); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--amber); padding: 0 10px; }
.btn.ghost:hover { background: var(--amber-soft); }
.btn.danger { background: var(--neg-soft); border-color: rgba(251, 113, 133, 0.3); color: #fda4af; }
.btn.sm { height: 32px; padding: 0 13px; font-size: 13px; }
.btn.icon { width: 40px; padding: 0; }
.btn.icon.sm { width: 32px; }
.btn.icon.ghost { color: var(--text-2); }
.btn.icon.ghost:hover { color: var(--text); background: rgba(255, 255, 255, 0.07); }
.btn:disabled { opacity: 0.45; cursor: default; filter: none; }
.btn svg { width: 16px; height: 16px; }

.in, select.in, textarea.in { height: 40px; border: 1px solid var(--line); border-radius: 999px; background: rgba(255, 255, 255, 0.035); color: var(--text); padding: 0 15px; min-width: 0; width: 100%;
  transition: border-color 0.15s, background 0.15s, box-shadow 0.15s; }
textarea.in { height: auto; min-height: 90px; padding: 11px 15px; resize: vertical; line-height: 1.5; border-radius: 18px; }
.in::placeholder, textarea.in::placeholder { color: var(--text-3); }
.in:hover { border-color: var(--line-2); }
.in:focus, textarea.in:focus { outline: none; border-color: rgba(255, 160, 40, 0.65); background: rgba(255, 255, 255, 0.05); box-shadow: 0 0 0 4px rgba(255, 160, 40, 0.12); }
.in.bad { border-color: var(--neg); box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.12); }
select.in { appearance: none; -webkit-appearance: none; padding-right: 34px; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--text-2) 50%), linear-gradient(135deg, var(--text-2) 50%, transparent 50%);
  background-position: calc(100% - 19px) 17px, calc(100% - 14px) 17px; background-size: 5px 5px; background-repeat: no-repeat; }
select.in option, select.in optgroup { background: #18181b; color: var(--text); }
.in.sm, select.in.sm { height: 32px; font-size: 13px; padding: 0 12px; }
select.in.sm { padding-right: 30px; background-position: calc(100% - 17px) 13px, calc(100% - 12px) 13px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--text-3); pointer-events: none; }
.search .in { padding-left: 39px; }

.seg { display: inline-flex; background: rgba(255, 255, 255, 0.04); border: 1px solid rgba(255, 255, 255, 0.09); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; color: var(--text-2); height: 30px; padding: 0 13px; border-radius: 999px; font-weight: 500; cursor: pointer; font-size: 13px; transition: background 0.15s, color 0.15s; }
.seg button:hover { color: var(--text); }
.seg button.on { background: #f4f4f5; color: #0a0a0b; font-weight: 600; }
.seg.trend button { min-width: 42px; }
.seg.trend button.on.pos { background: var(--pos); color: #052e16; }
.seg.trend button.on.neg { background: var(--neg); color: #3b0712; }

.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
  background: rgba(255, 255, 255, 0.05); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
.pill svg { width: 12px; height: 12px; }
.pill.pos { background: var(--pos-soft); border-color: rgba(74, 222, 128, 0.3); color: var(--pos); }
.pill.neg { background: var(--neg-soft); border-color: rgba(251, 113, 133, 0.3); color: var(--neg); }
.pill.amb { background: var(--amber-soft); border-color: rgba(255, 160, 40, 0.32); color: var(--amber); }
.pill.neu { background: rgba(250, 204, 21, 0.12); border-color: rgba(250, 204, 21, 0.28); color: var(--neu); }
.pill.tiny { height: 18px; font-size: 10.5px; padding: 0 7px; margin-left: 8px; vertical-align: 1px; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.03);
  color: var(--text); cursor: pointer; font-weight: 500; font-size: 13px; white-space: nowrap; transition: background 0.15s, border-color 0.15s; }
.chip:hover { background: rgba(255, 255, 255, 0.07); border-color: var(--line-2); }
.chip.on { background: var(--amber-soft); border-color: rgba(255, 160, 40, 0.45); color: var(--amber); }
.chip svg { width: 14px; height: 14px; }

.pos { color: var(--pos); } .neg { color: var(--neg); } .muted { color: var(--text-2); } .faint { color: var(--text-3); }

  box-shadow: 0 0 0 6px rgba(255, 255, 255, 0.03), 0 10px 30px -8px rgba(0, 0, 0, 0.6); }

/* ---------- Kacheln (Dashboard) */
.tiles { display: grid; gap: 18px; grid-template-columns: 1.45fr 1fr 1fr 1fr; }

  border-radius: var(--r-lg); padding: 20px 22px; display: flex; flex-direction: column; gap: 6px; min-height: 156px; box-shadow: var(--glass-edge);

.tile.hero { padding: 24px 26px; min-height: 176px; border-color: rgba(255, 255, 255, 0.1);
  background: radial-gradient(120% 130% at 100% 0%, rgba(255, 255, 255, 0.085), transparent 60%), linear-gradient(180deg, rgba(255, 255, 255, 0.065), rgba(255, 255, 255, 0.015)); }

  background: radial-gradient(circle, transparent 39px, rgba(255, 255, 255, 0.2) 40px, transparent 41px, transparent 69px, rgba(255, 255, 255, 0.11) 70px,
    transparent 71px, transparent 99px, rgba(255, 255, 255, 0.06) 100px, transparent 101px); }

@media (max-width: 560px) { .orbs { right: -110px; top: -80px; } .tile.hero .row { max-width: none; } }

/* Legenden */

/* ---------- Listen */

.li, .lh { display: grid; grid-template-columns: var(--cols); gap: 12px; align-items: center; }

}

/* ---------- Tags (Makro-Thesen) */

.tagticks { display: flex; gap: 6px; justify-content: flex-end; flex-wrap: nowrap; overflow: hidden; min-width: 0; }

.fld { display: flex; flex-direction: column; gap: 7px; min-width: 0; }

.lbl-sel { appearance: none; -webkit-appearance: none; border: 0; background: transparent; color: var(--text-2); font: inherit; font-size: 13.5px; padding: 0; cursor: pointer; max-width: 100%; text-overflow: ellipsis; }
.lbl-sel:hover { color: var(--text); }

.trends { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 30px; }
@media (max-width: 640px) { .trends { grid-template-columns: 1fr; } }
.tr-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; box-shadow: inset 0 -1px 0 var(--line-soft); min-width: 0; }

.tr-row .val { font-weight: 700; min-width: 34px; text-align: right; }
.text-box { background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line-soft); border-radius: 18px; padding: 12px 15px; min-height: 72px; white-space: pre-wrap; overflow-wrap: anywhere; }

.texts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 18px; }

.grid.inner { gap: 18px; }
.notes textarea { min-height: 190px; }

.file { background: rgba(255, 255, 255, 0.03); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }

.file .fm small { display: block; color: var(--text-3); font-size: 11px; }
.drop { border: 1.5px dashed var(--line-2); border-radius: 18px; padding: 18px; text-align: center; color: var(--text-2); font-size: 13px; }
.drop.over { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
.lightbox { position: fixed; inset: 0; z-index: 90; background: rgba(2, 2, 4, 0.92); display: grid; place-items: center; padding: 24px; }
.lightbox img { max-width: 100%; max-height: calc(100dvh - 80px); border-radius: 16px; }
.lightbox > .btn { position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); }
.lb-cap { position: absolute; left: 0; right: 0; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); text-align: center; color: var(--text-2); font-size: 13px; }

.lightbox .lb-next { right: max(16px, env(safe-area-inset-right, 0px)); }

/* Diagramm: Abweichung vom Peer-Median */
.dv { display: flex; flex-direction: column; }
.dv-row { display: grid; grid-template-columns: minmax(120px, 200px) minmax(0, 1fr) 84px 128px; gap: 14px; align-items: center; padding: 3px 6px; border-radius: 10px; }
.dv-row:not(.dv-axis):hover { background: rgba(255, 255, 255, 0.04); }
.dv-axis { padding-bottom: 2px; color: var(--text-3); font-size: 11px; }
.dv-scale { display: flex; justify-content: space-between; }
.dv-scale i { font-style: normal; font-variant-numeric: tabular-nums; }
.dv-name { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dv-track { position: relative; height: 22px; }
.dv-track::before { content: ""; position: absolute; left: 25%; right: 25%; top: 0; bottom: 0; border-left: 1px solid var(--line-soft); border-right: 1px solid var(--line-soft); }
.dv-zero { position: absolute; left: 50%; top: -3px; bottom: -3px; width: 1px; background: rgba(244, 244, 245, 0.3); }
.dv-bar { position: absolute; top: 5px; height: 12px; border-radius: 0 6px 6px 0; }
.dv-bar.neg { border-radius: 6px 0 0 6px; }
.dv-bar.over::after { content: ""; position: absolute; top: 2px; width: 0; height: 0; border-top: 4px solid transparent; border-bottom: 4px solid transparent; }
.dv-bar.over:not(.neg)::after { right: -7px; border-left: 5px solid rgba(244, 244, 245, 0.6); }
.dv-bar.neg.over::after { left: -7px; border-right: 5px solid rgba(244, 244, 245, 0.6); }
.dv-dev { text-align: right; font-weight: 700; font-size: 13.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.dv-vals { text-align: right; color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dv-legend { margin-top: 12px; padding: 0 6px; }
@media (max-width: 640px) {
  .dv-row { grid-template-columns: minmax(0, 1fr) 78px; gap: 2px 10px; padding: 5px 2px; }
  .dv-name { grid-column: 1 / -1; }
  .dv-vals { display: none; }
  .dv-axis span:first-child, .dv-axis span:last-child { display: none; }
}

/* ---------- Import, Einstellungen, Anleitung */
.steps { margin: 0 0 12px; padding-left: 20px; color: var(--text-2); line-height: 1.6; }

.login-card { width: min(410px, 100%); display: flex; flex-direction: column; gap: 14px; padding: 30px; border-radius: var(--r-xl);
  box-shadow: 0 30px 80px -30px rgba(0, 0, 0, 0.9), 0 0 90px -40px rgba(255, 255, 255, 0.18), var(--glass-edge); }

/* ---------- 8.4: Historie, Δ Vorquartal, Peer-Position, Segmente */
.hist-how ol { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--text-2); }

.hist-grp { margin-bottom: 14px; }

.hist { border-collapse: collapse; width: 100%; min-width: 760px; font-variant-numeric: tabular-nums; font-size: 13px; }
.hist th { color: var(--text-3); font-weight: 600; font-size: 11.5px; padding: 6px 8px; text-align: left; white-space: nowrap; border-bottom: 1px solid var(--line); vertical-align: bottom; }

/* Peer-Position: Linie = Spanne der Gruppe, Strich = Median, grüner Punkt = ausgewählte Aktie, rechts = besser */
.pp-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.pp-chips .chip.on, .pp-chips .chip.on:hover { background: var(--pos); border-color: var(--pos); color: #052e16; }

.pp-rows { column-gap: 36px; }
@media (min-width: 1200px) { .pp-rows { columns: 2; } }
.pp-row { display: grid; grid-template-columns: minmax(110px, 190px) minmax(0, 1fr) 84px; gap: 14px; align-items: center; min-height: 30px; padding: 2px 6px;
  border-radius: 10px; break-inside: avoid; }
.pp-row:hover { background: rgba(255, 255, 255, 0.035); }
.pp-name { color: var(--text-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pp-track { position: relative; height: 24px; margin: 0 8px; }
.pp-line { position: absolute; left: 0; right: 0; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: rgba(255, 255, 255, 0.16); }
.pp-med { position: absolute; top: 4px; bottom: 4px; width: 2px; margin-left: -1px; border-radius: 1px; background: rgba(255, 255, 255, 0.55); }
.pp-dot { position: absolute; top: 50%; z-index: 1; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; padding: 0; border: 0; border-radius: 50%;
  background: #71717a; box-shadow: 0 0 0 2px var(--card-solid); cursor: pointer; }
.pp-dot:hover, .pp-dot:focus-visible { background: #a1a1aa; }
.pp-dot.on, .pp-dot.on:hover { z-index: 2; width: 14px; height: 14px; margin: -7px 0 0 -7px; background: var(--pos); box-shadow: 0 0 0 2px var(--card-solid), 0 0 12px rgba(74, 222, 128, 0.55); }
.pp-tip { position: absolute; bottom: calc(100% + 2px); z-index: 5; transform: translateX(-50%); padding: 4px 8px; border-radius: 8px; white-space: nowrap; pointer-events: none;
  background: rgba(30, 30, 34, 0.97); border: 1px solid var(--line-2); color: var(--text); font-size: 12px; font-variant-numeric: tabular-nums; }
.pp-val { text-align: right; font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; white-space: nowrap; }
@media (max-width: 760px) {
  .pp-row { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; padding: 4px 6px; }
  .pp-track { grid-column: 1 / -1; grid-row: 2; }
}

/* Segmente: Ring (Umsatzanteile) und Balken (Bruttomarge), verbunden mit der Tabelle */
.seg-two { display: grid; grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr); gap: 18px; }
.seg-two figure { margin: 0; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: var(--r);
  background: rgba(255, 255, 255, 0.025); border: 1px solid var(--line-soft); }
.seg-two figure:first-child { align-items: center; }
.seg-two figcaption { align-self: flex-start; color: var(--text-2); font-size: 13px; font-weight: 600; }
.seg-two figcaption .faint { font-weight: 500; }
.donut { max-width: 100%; height: auto; }
.donut .dn-c { fill: var(--text); font-size: 17px; font-weight: 500; }
.donut .dn-s { fill: var(--text-3); font-size: 10px; }
.dn-part { cursor: pointer; transition: opacity 0.15s, stroke-width 0.15s; }
.dn-part.dim { opacity: 0.3; }
.sbars { position: relative; --sb-l: 150px; --sb-r: 64px; display: flex; flex-direction: column; gap: 8px; padding: 4px 0; margin-block: auto; }
.sb-axis { display: grid; grid-template-columns: var(--sb-l) minmax(0, 1fr) var(--sb-r); margin-top: 2px; font-size: 10.5px; color: var(--text-3); }
.sb-axis .sc { display: flex; justify-content: space-between; }
.sb-axis .sc i { font-style: normal; }
.sbar { display: grid; grid-template-columns: var(--sb-l) minmax(0, 1fr) var(--sb-r); align-items: center; min-height: 26px; cursor: pointer; transition: opacity 0.15s; }
.sbar.dim { opacity: 0.35; }
.sb-name { padding-right: 10px; font-size: 13px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sb-track { position: relative; height: 12px; border-radius: 6px; background: rgba(255, 255, 255, 0.05); overflow: hidden; }
.sb-fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.sb-none { position: absolute; inset: 0; display: flex; align-items: center; padding-left: 8px; font-style: normal; font-size: 10.5px; line-height: 1; color: var(--text-3); }

.sb-ref { position: absolute; top: 0; bottom: 18px; width: 0; border-left: 1px dashed rgba(255, 255, 255, 0.6); pointer-events: none; }
.seg-t { margin-top: 14px; width: 100%; }
.seg-t tbody tr { cursor: pointer; transition: opacity 0.15s; }
.seg-t tbody tr.dim { opacity: 0.4; }
.seg-t tbody tr:focus-visible { outline: 1px solid var(--amber); outline-offset: -1px; }
.kc.seg-t td:first-child, .kc.seg-ed td:first-child { width: auto; max-width: none; }
.seg-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 9px; vertical-align: -1px; }
.seg-check { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin-top: 14px; font-size: 13px; color: var(--text-2); }
.seg-check b { color: var(--text); }
.segtab { padding: 2px; }
.seg-ed { width: 100%; }
.seg-ed td { padding: 5px 0; }
.seg-ed td + td { padding-left: 8px; }
.seg-ed .in { width: 100%; }
.seg-ed .in.num { width: 110px; text-align: right; }
@media (max-width: 760px) {
  .seg-two { grid-template-columns: 1fr; }
  .sbars { --sb-l: 108px; --sb-r: 58px; }
  .seg-ed .in.num { width: 76px; }
}
@media (max-width: 560px) {
  .kc.seg-t td:first-child { max-width: 0; width: 34%; }
  .seg-t th { white-space: normal; line-height: 1.25; vertical-align: bottom; }
  .seg-t th, .seg-t td { padding-left: 6px; }
  .seg-t th:first-child, .seg-t td:first-child { padding-left: 0; }
}
@media (max-width: 560px) { .seg-t th:nth-child(3), .seg-t td:nth-child(3) { display: none; } }

/* Valuence · Design „Terminal“ (Standard): Schwarz, Schreibmaschinenschrift für Zahlen und Beschriftungen, Rasterlinien,
   eckige Formen, Amber für Aktives und Ticker. Liegt als Schicht über Aurora (styles.css); aktiv mit <html data-design="terminal">.
   Aufbau, Kopfleiste und Logo sind in beiden Designs gleich, nur die Darstellung ändert sich. */
[data-design="terminal"] {
  --bg: #000000;
  --card: #0b0b0b; --card-solid: #0b0b0b;
  --glass: #0b0b0b; --glass-2: #111111; --glass-3: #161616;
  --line: #262626; --line-2: #3a3a3a; --line-soft: #1c1c1c; --sep: #262626; --sep-soft: #1c1c1c;
  --head: #0f0f0f;
  --text: #f2f2f2; --text-2: #b0b0b0; --text-3: #8c8c8c;
  --amber: #ffa028; --amber-2: #ffc170; --amber-soft: rgba(255, 160, 40, 0.12); --ink: #000000;
  --ticker: #ffa028;
  --pos: #4ade80; --pos-soft: rgba(74, 222, 128, 0.1);
  --neg: #ff6b6b; --neg-soft: rgba(255, 107, 107, 0.1);
  --neu: #f2c94c;
  --warn-bg: rgba(255, 107, 107, 0.12);
  --shadow: 0 18px 44px rgba(0, 0, 0, 0.85);
  --font: "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --r-xl: 0; --r-lg: 0; --r: 0; --r-sm: 0;
}
[data-design="terminal"] *, [data-design="terminal"] *::before, [data-design="terminal"] *::after { border-radius: 0 !important; }
[data-design="terminal"] ::selection { background: rgba(255, 160, 40, 0.4); }
[data-design="terminal"] :focus-visible { outline: 1px solid var(--amber); outline-offset: 1px; }
[data-design="terminal"] .bgfx, [data-design="terminal"] .orbs, [data-design="terminal"] .av { display: none !important; }

/* Schreibmaschinenschrift für Zahlen, Beschriftungen und Bedienelemente */
[data-design="terminal"] :is(.head h1, .head p, .card h2, .card h3, h3.sec, .btn, .in, .seg button, .pill, .chip, .tag, .kbd, .tabs button,
  .t th, .t td.r, .t td.c, .tick, .tickin, .lh, .li .cellx, .tile .lab, .tile .big, .tile .sub, .hits, .status, .tabbar button, .modal > header h2,
  .pop .ttl, .legend, .segpart, .fld > label, .kc th, .kc td.r, .kvrow .v, .tr-row .val, .dv-dev, .dv-vals, .dv-axis, .toast, .num, .cntb, .idx,
  .unit span, .calc, .banner, .drop, .switch, .doc h2, .empty b, .tagname b, .morelist .nav, .linkn.cnum) { font-family: var(--mono); }
[data-design="terminal"] textarea.in, [data-design="terminal"] .pastezone { font-family: var(--mono); }
[data-design="terminal"] textarea.in:not(.pastezone) { font-family: var(--font); }

/* ---------- Grundgerüst und Kopfleiste */
[data-design="terminal"] .app { padding-top: 0; }
[data-design="terminal"] .main { gap: 14px; padding-top: 16px; }
/* Gleiche Kopfleiste wie Aurora (Marke, Navigation, Werkzeuge), hier flach und eckig; Seitenwahl zusätzlich über die Tasten 1–7 */
[data-design="terminal"] .topnav { top: 0; gap: 14px; padding: calc(10px + env(safe-area-inset-top, 0px)) 0 10px; background: var(--bg); border: 0;
  border-bottom: 1px solid var(--line); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
[data-design="terminal"] .brand { gap: 10px; }
[data-design="terminal"] .brand b { font: 600 13px/1.2 var(--mono); color: var(--amber); letter-spacing: 0.16em; text-transform: uppercase; }
[data-design="terminal"] .brand small { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; }
[data-design="terminal"] .navpill { padding: 0; gap: 4px; border: 0; background: none; }
[data-design="terminal"] .nav { height: 34px; padding: 0 12px; gap: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--text); box-shadow: none;
  font: 500 12px/1 var(--mono); letter-spacing: 0.06em; text-transform: uppercase; transition: background 0.12s, border-color 0.12s; }
[data-design="terminal"] .nav svg { display: none; }
[data-design="terminal"] .nav .k { display: inline; color: var(--text-3); }
[data-design="terminal"] .nav .cnt { font-size: 11px; font-weight: 500; color: var(--text-3); }
[data-design="terminal"] .nav:hover { background: #111111; border-color: var(--line-2); color: var(--text); }
[data-design="terminal"] .nav.on { background: var(--amber); border-color: var(--amber); color: #000000; font-weight: 600; box-shadow: none; }
[data-design="terminal"] .nav.on .k, [data-design="terminal"] .nav.on .cnt { color: rgba(0, 0, 0, 0.66); }
[data-design="terminal"] .topnav[data-c6] .nav { padding: 0 11px; }
[data-design="terminal"] .tools { gap: 8px; }
[data-design="terminal"] .searchpill { height: 34px; min-width: 230px; gap: 10px; padding: 0 10px 0 12px; border: 1px solid var(--line); background: var(--bg);
  color: var(--text-3); font: 12px/1 var(--mono); cursor: text; }
[data-design="terminal"] .searchpill svg { display: none; }
[data-design="terminal"] .searchpill::before { content: "CMD ›"; flex: none; color: var(--amber); font-weight: 600; letter-spacing: 0.06em; }
[data-design="terminal"] .searchpill:hover { background: var(--bg); border-color: var(--line-2); color: var(--text-2); }
[data-design="terminal"] .topnav[data-c4] .searchpill { width: auto; padding: 0 10px; }
[data-design="terminal"] .topnav .iconbtn { width: 34px; height: 34px; border: 1px solid var(--line); background: var(--bg); color: var(--text-2); }
[data-design="terminal"] .topnav .iconbtn svg { width: 16px; height: 16px; }
[data-design="terminal"] .topnav .iconbtn:hover { color: var(--text); border-color: var(--line-2); background: #111111; }
[data-design="terminal"] .topnav .iconbtn.on { color: var(--amber); border-color: var(--amber); background: var(--bg); }
[data-design="terminal"] .topnav .status { height: 34px; padding: 0 4px; gap: 8px; color: var(--pos); }
[data-design="terminal"] .topnav .status:has(.dot.wait) { color: var(--neu); }
[data-design="terminal"] .topnav .status:has(.dot.off) { color: var(--neg); }
[data-design="terminal"] .acct { height: 34px; padding: 0 4px 0 10px; border: 1px solid var(--line); background: var(--bg); }
[data-design="terminal"] .acct .ini { display: none; }
[data-design="terminal"] .acct .mail { font: 12px/1 var(--mono); color: var(--text-2); }
[data-design="terminal"] .acct .iconbtn { width: 26px; height: 26px; }
[data-design="terminal"] .acct .iconbtn svg { width: 14px; height: 14px; }
[data-design="terminal"] .dot { box-shadow: none; }
[data-design="terminal"] .status { font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; }

/* Telefon und schmale Fenster: Leiste unten, oben nur Marke, Status und Suche */
@media (max-width: 899px) {
  [data-design="terminal"] .topnav { padding: calc(8px + env(safe-area-inset-top, 0px)) 0 8px; }
  [data-design="terminal"] .main { padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
  [data-design="terminal"] .tabbar { left: 0; right: 0; bottom: 0; height: calc(60px + env(safe-area-inset-bottom, 0px)); padding: 0 0 env(safe-area-inset-bottom, 0px);
    gap: 0; background: var(--bg); border: 0; border-top: 1px solid var(--line); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
  [data-design="terminal"] .tabbar button { border-top: 2px solid transparent; font-size: 10px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
  [data-design="terminal"] .tabbar button.on { background: transparent; color: var(--amber); border-top-color: var(--amber); }
  [data-design="terminal"] .tabbar button.on svg { filter: none; color: var(--amber); }
  [data-design="terminal"] .toast { bottom: calc(76px + env(safe-area-inset-bottom, 0px)); }
}
[data-design="terminal"] .morelist .nav { height: 44px; border: 1px solid var(--line); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text); }
[data-design="terminal"] .morelist .nav.on { background: var(--amber); border-color: var(--amber); color: #000000; }
[data-design="terminal"] .nav.on::after { display: none; }

/* ---------- Seitenkopf */
[data-design="terminal"] .head { padding: 6px 0 0; }
[data-design="terminal"] .head h1 { font-size: 26px; font-weight: 600; line-height: 1.2; letter-spacing: 0.02em; text-transform: uppercase; }
[data-design="terminal"] .head p { margin-top: 4px; font-size: 12px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); }
@media (max-width: 760px) { [data-design="terminal"] .head h1 { font-size: 22px; } }

/* ---------- Karten als Terminal-Fenster mit Titelzeile */
[data-design="terminal"] .grid { gap: 14px; }
[data-design="terminal"] .card { background: var(--card-solid); border: 1px solid var(--line); padding: 14px 16px 16px; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
[data-design="terminal"] .card > header { margin: -14px -16px 14px; padding: 8px 16px; min-height: 40px; gap: 6px 12px; background: var(--head); border-bottom: 1px solid var(--line); }
[data-design="terminal"] .card.flush > header { margin: 0; }
[data-design="terminal"] .card h2 { gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); }
[data-design="terminal"] .card h2 .idx, [data-design="terminal"] .idx { font-size: 12px; font-weight: 500; letter-spacing: 0.04em; color: var(--text-3); }
[data-design="terminal"] .card > header .sub { display: block; margin-top: 2px; font-size: 12px; color: var(--text-3); }
[data-design="terminal"] .card h3, [data-design="terminal"] h3.sec { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; color: var(--text-3); }
[data-design="terminal"] .sub { color: var(--text-3); }
[data-design="terminal"] .flush-x .tbl-wrap { margin: 0 -16px -16px; }
@media (max-width: 760px) {
  [data-design="terminal"] .card { padding: 12px; }
  [data-design="terminal"] .card > header { margin: -12px -12px 12px; padding: 8px 12px; }
  [data-design="terminal"] .flush-x .tbl-wrap { margin: 0 -12px -12px; }
}

/* ---------- Kennzahlen-Leiste (Dashboard): Zellen im Raster, Segmentbalken statt Ringe */
[data-design="terminal"] .tiles { gap: 1px; grid-template-columns: repeat(4, minmax(0, 1fr)); background: var(--line); border: 1px solid var(--line); }
@media (max-width: 1180px) { [data-design="terminal"] .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } [data-design="terminal"] .tile.hero { grid-column: auto; } }
@media (max-width: 640px) { [data-design="terminal"] .tiles { grid-template-columns: minmax(0, 1fr); } }
[data-design="terminal"] .tile, [data-design="terminal"] .tile.hero { min-height: 0; gap: 6px; padding: 16px 18px; background: var(--bg); border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
[data-design="terminal"] .tile .lab { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-3); }
[data-design="terminal"] .tile .big, [data-design="terminal"] .tile.hero .big { margin-top: 4px; font-size: 46px; font-weight: 500; line-height: 1.05; letter-spacing: 0; }
[data-design="terminal"] .tile .sub { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
[data-design="terminal"] .tile.tbtn { display: flex; flex-direction: column; align-items: stretch; border: 0; transition: background 0.12s; }
[data-design="terminal"] .tile.tbtn:hover { transform: none; background: #0d0d0d; }
[data-design="terminal"] .tile.tbtn .big { color: var(--tc); }
[data-design="terminal"] .tile.tbtn .tl .sub { margin-top: 2px; }
[data-design="terminal"] .ring { display: none; }
[data-design="terminal"] .tpct { display: inline; color: var(--tc); letter-spacing: 0.06em; }
[data-design="terminal"] .tbar { display: block; height: 8px; margin-top: 10px; background: repeating-linear-gradient(90deg, #262626 0 6px, transparent 6px 8px); }
[data-design="terminal"] .tbar i { display: block; height: 100%; background: repeating-linear-gradient(90deg, var(--tc) 0 6px, transparent 6px 8px); }
[data-design="terminal"] .tile.hero .row { max-width: none; margin-top: 10px; }
@media (max-width: 640px) { [data-design="terminal"] .tile .big, [data-design="terminal"] .tile.hero .big { font-size: 38px; } }

/* Teile eines Ganzen */
[data-design="terminal"] .legend { font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; }
[data-design="terminal"] .legend i { width: 9px; height: 9px; }

/* ---------- Knöpfe, Felder, Segmente */
[data-design="terminal"] .btn { height: 34px; padding: 0 14px; border: 1px solid var(--line); background: var(--bg); color: var(--text); box-shadow: none;
  font-size: 12px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
[data-design="terminal"] .btn:hover { background: #111111; border-color: var(--line-2); }
[data-design="terminal"] .btn.pri { background: var(--bg); border-color: var(--amber); color: var(--amber); font-weight: 600; box-shadow: none; filter: none; }
[data-design="terminal"] .btn.pri:hover { background: var(--amber); color: #000000; box-shadow: none; filter: none; }
[data-design="terminal"] .btn.ghost { background: transparent; border-color: transparent; color: var(--amber); padding: 0 8px; }
[data-design="terminal"] .btn.ghost:hover { background: var(--amber-soft); }
[data-design="terminal"] .btn.danger { background: transparent; border-color: rgba(255, 107, 107, 0.55); color: var(--neg); }
[data-design="terminal"] .btn.danger:hover { background: var(--neg-soft); }
[data-design="terminal"] .btn.sm { height: 28px; padding: 0 10px; font-size: 11px; }
[data-design="terminal"] .btn.icon { width: 34px; padding: 0; }
[data-design="terminal"] .btn.icon.sm { width: 28px; }
[data-design="terminal"] .btn.icon.ghost { color: var(--text-2); }
[data-design="terminal"] .btn.icon.ghost:hover { color: var(--text); background: #161616; }
[data-design="terminal"] .in, [data-design="terminal"] select.in, [data-design="terminal"] textarea.in { height: 34px; padding: 0 10px; border: 1px solid var(--line);
  background-color: var(--bg); box-shadow: none; font-size: 13px; }
[data-design="terminal"] textarea.in { height: auto; padding: 9px 10px; font-size: 13.5px; line-height: 1.55; }
[data-design="terminal"] .in:hover { border-color: var(--line-2); }
[data-design="terminal"] .in:focus, [data-design="terminal"] textarea.in:focus { border-color: var(--amber); background-color: var(--bg); box-shadow: none; }
[data-design="terminal"] .in.bad { border-color: var(--neg); box-shadow: none; }
[data-design="terminal"] select.in { padding-right: 30px; background-position: calc(100% - 17px) 14px, calc(100% - 12px) 14px; }
[data-design="terminal"] .in.sm, [data-design="terminal"] select.in.sm { height: 28px; padding: 0 8px; font-size: 12px; }
[data-design="terminal"] select.in.sm { padding-right: 28px; background-position: calc(100% - 16px) 11px, calc(100% - 11px) 11px; }
[data-design="terminal"] select.in option, [data-design="terminal"] select.in optgroup, [data-design="terminal"] .chip.sel select option,
[data-design="terminal"] .t select.cellin option, [data-design="terminal"] .lbl-sel option, [data-design="terminal"] .lbl-sel optgroup { background: #0b0b0b; }
[data-design="terminal"] .search svg { left: 10px; }
[data-design="terminal"] .search .in { padding-left: 32px; }
[data-design="terminal"] .unit .in { padding-right: 44px; }
[data-design="terminal"] .unit span { right: 10px; }
[data-design="terminal"] .calc { height: 34px; padding: 0 6px 0 10px; border: 1px dashed var(--line-2); background: transparent; font-size: 13px; }
[data-design="terminal"] .fld > label { padding: 0; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
[data-design="terminal"] .fld > label em { text-transform: none; letter-spacing: 0; }
[data-design="terminal"] .fld .msg { padding: 0; }
[data-design="terminal"] .seg { padding: 0; gap: 0; border: 1px solid var(--line); background: var(--bg); }
[data-design="terminal"] .seg button { height: 28px; padding: 0 11px; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-2); }
[data-design="terminal"] .seg button + button { box-shadow: inset 1px 0 0 var(--line); }
[data-design="terminal"] .seg button:hover { color: var(--text); background: #111111; }
[data-design="terminal"] .seg button.on { background: var(--amber); color: #000000; font-weight: 600; box-shadow: none; }
[data-design="terminal"] .seg.trend button.on.pos { background: var(--pos); color: #000000; }
[data-design="terminal"] .seg.trend button.on.neg { background: var(--neg); color: #000000; }
[data-design="terminal"] .pill { height: 22px; padding: 0 8px; border: 1px solid var(--line-2); background: transparent; color: var(--text-2);
  font-size: 11px; font-weight: 500; letter-spacing: 0.06em; text-transform: uppercase; }
[data-design="terminal"] .pill.pos { background: transparent; border-color: rgba(74, 222, 128, 0.5); color: var(--pos); }
[data-design="terminal"] .pill.neg { background: transparent; border-color: rgba(255, 107, 107, 0.5); color: var(--neg); }
[data-design="terminal"] .pill.amb { background: transparent; border-color: rgba(255, 160, 40, 0.55); color: var(--amber); }
[data-design="terminal"] .pill.neu { background: transparent; border-color: rgba(242, 201, 76, 0.5); color: var(--neu); }
[data-design="terminal"] .pill.tiny { height: 18px; padding: 0 6px; font-size: 10px; }
[data-design="terminal"] .chip { height: 30px; padding: 0 10px; border: 1px solid var(--line); background: var(--bg); font-size: 12px; }
[data-design="terminal"] .chip:hover { background: #111111; border-color: var(--line-2); }
[data-design="terminal"] .chip.on { background: transparent; border-color: var(--amber); color: var(--amber); }
[data-design="terminal"] .chip.sel { padding-right: 4px; }
[data-design="terminal"] .chip.sel select { height: 22px; background: #161616; font-family: var(--mono); font-size: 12px; }
[data-design="terminal"] .chip.tickchip { height: 24px; padding: 0 8px; font-size: 12px; font-weight: 600; letter-spacing: 0.04em; color: var(--ticker); border-color: var(--line); background: var(--bg); }
[data-design="terminal"] .chip.tickchip:hover { border-color: var(--amber); background: var(--bg); }
[data-design="terminal"] .switch { font-size: 12px; letter-spacing: 0.02em; }
[data-design="terminal"] .switch i { width: 36px; height: 18px; background: #1c1c1c; box-shadow: inset 0 0 0 1px var(--line-2); }
[data-design="terminal"] .switch i::after { top: 3px; left: 3px; width: 12px; height: 12px; background: var(--text-2); box-shadow: none; }
[data-design="terminal"] .switch.on i { background: var(--amber); box-shadow: none; }
[data-design="terminal"] .switch.on i::after { transform: translateX(18px); background: #000000; }
[data-design="terminal"] .kbd { padding: 1px 6px; border: 1px solid var(--line-2); background: transparent; color: var(--text-3); font-size: 11px; }
[data-design="terminal"] .tick, [data-design="terminal"] button.tick, [data-design="terminal"] a.tick { font-weight: 600; letter-spacing: 0.02em; }
[data-design="terminal"] .linkn { font-weight: 500; }
[data-design="terminal"] .banner { padding: 9px 12px; background: transparent; border: 1px solid rgba(255, 160, 40, 0.5); font-size: 12px; }
[data-design="terminal"] .banner.err { background: transparent; border-color: rgba(255, 107, 107, 0.55); color: var(--neg); }
[data-design="terminal"] .empty b { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); }

/* ---------- Listen und Tabellen */
[data-design="terminal"] .li { padding: 8px 10px; }
[data-design="terminal"] .li:hover, [data-design="terminal"] .li.hl { background: #141414; }
[data-design="terminal"] .li + .li { box-shadow: 0 -1px 0 var(--line-soft); }
[data-design="terminal"] .li .who { gap: 10px; }
[data-design="terminal"] .li .who .tick { font-size: 13px; }
[data-design="terminal"] .li .cellx { font-size: 13px; }
[data-design="terminal"] .lh { font-size: 10.5px; font-weight: 500; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-3); }
[data-design="terminal"] .tbl-wrap { border-radius: 0; }
[data-design="terminal"] table.t { font-size: 13px; }
[data-design="terminal"] .t th { padding: 9px 12px; background: var(--head); color: var(--text-3); box-shadow: inset 0 -1px 0 var(--line);
  font-size: 11px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; }
[data-design="terminal"] .t th .hl, [data-design="terminal"] .t th button { text-transform: inherit; letter-spacing: inherit; }   /* Knöpfe erben das sonst nicht */
[data-design="terminal"] .t td { height: 36px; padding: 7px 12px; box-shadow: inset 0 -1px 0 var(--line-soft); }
[data-design="terminal"] .t td:first-child, [data-design="terminal"] .t th:first-child { padding-left: 16px; }
[data-design="terminal"] .t tbody tr:hover td { background: #141414; }
[data-design="terminal"] .t .stk { background: var(--card-solid); }
[data-design="terminal"] .t th.stk { background: var(--head); }
[data-design="terminal"] .t td.ed { padding: 3px 6px; }
[data-design="terminal"] .t th .hm { width: 22px; height: 22px; border-color: var(--line-2); background: transparent; }
[data-design="terminal"] .t .hm.on { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }
[data-design="terminal"] .t input.cellin, [data-design="terminal"] .t select.cellin, [data-design="terminal"] .t textarea.cellin { padding: 5px 8px; }
[data-design="terminal"] .t .cellin:hover { background: #111111; border-color: var(--line); }
[data-design="terminal"] .t .cellin:focus { background: var(--bg); border-color: var(--amber); }
[data-design="terminal"] .card-bar { padding: 10px 12px; box-shadow: inset 0 -1px 0 var(--line); }
[data-design="terminal"] .more { box-shadow: inset 0 1px 0 var(--line); }
[data-design="terminal"] .fill { height: 6px; background: repeating-linear-gradient(90deg, #262626 0 4px, transparent 4px 5px); }
[data-design="terminal"] .fill i { background: repeating-linear-gradient(90deg, var(--amber) 0 4px, transparent 4px 5px); }
[data-design="terminal"] .hits b { font-size: 34px; font-weight: 500; letter-spacing: 0; text-shadow: none; }
[data-design="terminal"] .sortrow, [data-design="terminal"] .form-foot, [data-design="terminal"] .backup { box-shadow: inset 0 1px 0 var(--line); }

/* Tags */
[data-design="terminal"] .tag { height: 24px; gap: 7px; padding: 0 8px; border: 1px solid var(--line-2); background: var(--bg); font-size: 11.5px; font-weight: 500;
  letter-spacing: 0.06em; text-transform: uppercase; }
[data-design="terminal"] .tag::before { width: 7px; height: 7px; box-shadow: none; }
[data-design="terminal"] .tag.sm { height: 20px; padding: 0 6px; font-size: 10.5px; }
[data-design="terminal"] .tagrow { padding: 10px 12px; background: var(--bg); border: 1px solid var(--line-soft); }
[data-design="terminal"] .tagname .tdot { width: 8px; height: 8px; box-shadow: none; }
[data-design="terminal"] .tagname b { font-size: 13px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; }
[data-design="terminal"] .tagname .cntb { padding: 0 6px; border: 1px solid var(--line-2); background: transparent; font-weight: 500; }
[data-design="terminal"] .tagpick { padding: 8px; border: 1px solid var(--line); background: var(--bg); }
[data-design="terminal"] .tagtable .swatch { box-shadow: none; }

/* ---------- Menüs, Dialoge, Meldungen */
